<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ROBERT Clima</title>


    <!-- Gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                sans-serif;

            background:
                #101820;

            color: white;

            min-height: 100vh;

            padding: 20px;
        }


        .contenedor {

            max-width: 600px;

            margin:
                auto;
        }


        h1 {

            text-align: center;

            margin-bottom: 5px;
        }


        .estado {

            text-align: center;

            margin-bottom: 25px;

            color: #55d66b;
        }


        .principal {

            background:
                #1b2733;

            border-radius: 20px;

            padding: 25px;

            text-align: center;

            margin-bottom: 15px;
        }


        .temperatura {

            font-size: 64px;

            font-weight: bold;
        }


        .unidad {

            font-size: 24px;
        }


        .descripcion {

            margin-top: 10px;

            font-size: 20px;

            color: #bfc9d4;
        }


        .datos {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;
        }


        .dato {

            background:
                #1b2733;

            border-radius: 15px;

            padding: 18px;

            text-align: center;
        }


        .dato .nombre {

            color:
                #9eabb8;

            font-size:
                14px;

            margin-bottom:
                8px;
        }


        .dato .valor {

            font-size:
                22px;

            font-weight:
                bold;
        }


        .actualizacion {

            text-align:
                center;

            color:
                #9eabb8;

            font-size:
                13px;

            margin-top:
                20px;
        }


        .error {

            background:
                #5c2525;

            color:
                #ffb3b3;

            padding:
                15px;

            border-radius:
                12px;

            text-align:
                center;

            display:
                none;
        }


        .historial {
            background: #1b2733;
            border-radius: 20px;
            padding: 20px;
            margin-top: 15px;
        }

        .historial h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 18px;
            font-size: 22px;
        }

        .grafico {
            position: relative;
            width: 100%;
            height: 280px;
        }

        .tabla-contenedor {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            padding: 9px 7px;
            text-align: center;
            border-bottom: 1px solid #334352;
            white-space: nowrap;
        }

        th {
            color: #9eabb8;
            font-weight: normal;
        }

        td {
            color: white;
        }

        @media (max-width: 450px) {

            body {
                padding: 12px;
            }

            .temperatura {
                font-size: 52px;
            }

        }

    </style>

</head>


<body>


<div class="contenedor">


    <h1>
        ROBERT Clima
    </h1>


    <div
        id="estado"
        class="estado"
    >
        
    </div>


    <div
        id="error"
        class="error"
    >
    </div>


    <div class="principal">

        <div>

            <span
                id="temperatura"
                class="temperatura"
            >
                --
            </span>

            <span class="unidad">
                °C
            </span>

        </div>


        <div
            id="sensacion"
            class="descripcion"
        >
            Sensación: --
        </div>

    </div>


    <div class="datos">


        <div class="dato">

            <div class="nombre">
                Humedad
            </div>

            <div
                id="humedad"
                class="valor"
            >
                --
            </div>

        </div>


        <div class="dato">

            <div class="nombre">
                Viento
            </div>

            <div
                id="viento"
                class="valor"
            >
                --
            </div>

        </div>


        <div class="dato">

            <div class="nombre">
                Mínima
            </div>

            <div
                id="minima"
                class="valor"
            >
                --
            </div>

        </div>


        <div class="dato">

            <div class="nombre">
                Máxima
            </div>

            <div
                id="maxima"
                class="valor"
            >
                --
            </div>

        </div>


    </div>


    <div
        id="actualizacion"
        class="actualizacion"
    >
        Última actualización: --
    </div>



    <div class="historial">
        <h2>Historial</h2>

        <div class="grafico">
            <canvas id="graficoTemperatura"></canvas>
        </div>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Fecha y hora</th>
                        <th>Temp.</th>
                        <th>Sensación</th>
                        <th>Humedad</th>
                        <th>Viento</th>
                    </tr>
                </thead>
                <tbody id="tablaHistorial"></tbody>
            </table>
        </div>
    </div>

</div>



<script>


// ==================================================
// SUPABASE
// ==================================================


// REEMPLAZAR ESTOS DOS VALORES

const SUPABASE_URL =
    "https://xvztoywavhepjrnynuqf.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_pNAU538ou89EPlKLWYm5Gg_rgJy-uGN";



const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



// ==================================================
// OBTENER ÚLTIMA MEDICIÓN
// ==================================================

async function obtenerDatos() {


    const {

        data,
        error

    } = await supabaseClient

        .from("telemetria")

        .select("*")

        .order(
            "creado_en",
            {
                ascending: false
            }
        )

        .limit(1);



    if (error) {

        mostrarError(
            error.message
        );

        return;
    }


    if (
        !data ||
        data.length === 0
    ) {

        mostrarError(
            "No hay datos disponibles."
        );

        return;
    }


    mostrarDatos(
        data[0]
    );

}



// ==================================================
// MOSTRAR DATOS
// ==================================================

function mostrarDatos(
    datos
) {


    document.getElementById(
        "temperatura"
    ).textContent =
        Number(
            datos.temperatura
        ).toFixed(1);


    document.getElementById(
        "sensacion"
    ).textContent =
        "Sensación: " +
        Number(
            datos.sensacion
        ).toFixed(1) +
        " °C";


    document.getElementById(
        "humedad"
    ).textContent =
        Number(
            datos.humedad
        ).toFixed(0) +
        " %";


    document.getElementById(
        "viento"
    ).textContent =
        Number(
            datos.viento
        ).toFixed(1) +
        " km/h";


    document.getElementById(
        "minima"
    ).textContent =
        Number(
            datos.minima
        ).toFixed(1) +
        " °C";


    document.getElementById(
        "maxima"
    ).textContent =
        Number(
            datos.maxima
        ).toFixed(1) +
        " °C";
document.getElementById(
        "actualizacion"
    ).textContent =
        "Última actualización: " +
        formatearFecha(
            datos.creado_en
        );





    document.getElementById(
        "error"
    ).style.display =
        "none";

}



// ==================================================
// FORMATEAR FECHA
// ==================================================

function formatearFecha(
    fecha
) {

    const fechaLocal =
        new Date(
            fecha
        );


    return fechaLocal.toLocaleString(
        "es-AR",
        {
            dateStyle:
                "short",

            timeStyle:
                "medium"
        }
    );

}



// ==================================================
// MOSTRAR ERROR
// ==================================================

function mostrarError(
    mensaje
) {

    document.getElementById(
        "error"
    ).textContent =
        "Error: " +
        mensaje;


    document.getElementById(
        "error"
    ).style.display =
        "block";


    document.getElementById(
        "estado"
    ).textContent =
        "● ERROR DE CONEXIÓN";


    document.getElementById(
        "estado"
    ).style.color =
        "#ff6666";

}




// ==================================================
// HISTORIAL
// ==================================================

let graficoTemperatura = null;

async function obtenerHistorial() {

    const { data, error } = await supabaseClient
        .from("telemetria")
        .select("creado_en, temperatura, sensacion, humedad, viento")
        .order("creado_en", { ascending: false })
        .limit(50);

    if (error) {
        console.error("Error obteniendo historial:", error.message);
        return;
    }

    if (!data || data.length === 0) return;

    const datos = [...data].reverse();

    const etiquetas = datos.map(dato =>
        new Date(dato.creado_en).toLocaleTimeString(
            "es-AR",
            { hour: "2-digit", minute: "2-digit" }
        )
    );

    const temperaturas = datos.map(dato => Number(dato.temperatura));

    const ctx = document.getElementById("graficoTemperatura");

    if (graficoTemperatura) {
        graficoTemperatura.destroy();
    }

    graficoTemperatura = new Chart(ctx, {
        type: "line",
        data: {
            labels: etiquetas,
            datasets: [{
                label: "Temperatura (°C)",
                data: temperaturas,
                tension: 0.3,
                pointRadius: 3,
                pointHoverRadius: 5,
                fill: false
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    labels: { color: "white" }
                }
            },
            scales: {
                x: {
                    ticks: {
                        color: "#9eabb8",
                        maxTicksLimit: 8
                    },
                    grid: { color: "#334352" }
                },
                y: {
                    ticks: { color: "#9eabb8" },
                    grid: { color: "#334352" }
                }
            }
        }
    });

    const tabla = document.getElementById("tablaHistorial");
    tabla.innerHTML = "";

    data.forEach(dato => {
        const fila = document.createElement("tr");

        fila.innerHTML = `
            <td>${formatearFecha(dato.creado_en)}</td>
            <td>${Number(dato.temperatura).toFixed(1)} °C</td>
            <td>${Number(dato.sensacion).toFixed(1)} °C</td>
            <td>${Number(dato.humedad).toFixed(0)} %</td>
            <td>${Number(dato.viento).toFixed(1)} km/h</td>
        `;

        tabla.appendChild(fila);
    });
}


// ==================================================
// ACTUALIZACIÓN AUTOMÁTICA
// ==================================================

obtenerDatos();
obtenerHistorial();

setInterval(
    () => {
        obtenerDatos();
        obtenerHistorial();
    },
    30000
);


</script>


</body>

</html>
