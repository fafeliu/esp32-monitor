<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROBERT Clima</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101820;
    color: white;
    min-height: 100vh;
    padding: 20px;
}

.contenedor {
    max-width: 600px;
    margin: auto;
}

h1 {
    text-align: center;
    margin-bottom: 5px;
}

.estado {
    text-align: center;
    margin-bottom: 25px;
    color: #55d66b;
}

.principal {
    background: #1b2733;
    border-radius: 20px;
    padding: 25px;
    text-align: center;
    margin-bottom: 15px;
}

.temperatura {
    font-size: 64px;
    font-weight: bold;
}

.unidad { font-size: 24px; }

.descripcion {
    margin-top: 10px;
    font-size: 20px;
    color: #bfc9d4;
}

.datos {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.dato {
    background: #1b2733;
    border-radius: 15px;
    padding: 18px;
    text-align: center;
}

.dato .nombre {
    color: #9eabb8;
    font-size: 14px;
    margin-bottom: 8px;
}

.dato .valor {
    font-size: 22px;
    font-weight: bold;
}

.actualizacion {
    text-align: center;
    color: #9eabb8;
    font-size: 13px;
    margin-top: 20px;
}

.error {
    background: #5c2525;
    color: #ffb3b3;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    display: none;
}

.historial {
    background: #1b2733;
    border-radius: 20px;
    padding: 20px;
    margin-top: 15px;
}

.historial h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 18px;
    font-size: 22px;
}

.periodos {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 7px;
    margin-bottom: 18px;
}

.periodo {
    border: 1px solid #435465;
    background: #243442;
    color: #bfc9d4;
    border-radius: 10px;
    padding: 9px 5px;
    cursor: pointer;
    font-size: 13px;
}

.periodo.activo {
    background: #3a5268;
    color: white;
    border-color: #6f8da5;
}

.grafico-scroll {
    overflow-x: auto;
    overflow-y: hidden;
    -webkit-overflow-scrolling: touch;
    border-radius: 12px;
}

.grafico {
    position: relative;
    height: 300px;
    min-width: 700px;
}

.ayuda-grafico {
    text-align: center;
    color: #7f8e9c;
    font-size: 12px;
    margin-top: 8px;
}

.tabla-contenedor {
    overflow-x: auto;
    margin-top: 22px;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

th, td {
    padding: 9px 7px;
    text-align: center;
    border-bottom: 1px solid #334352;
    white-space: nowrap;
}

th {
    color: #9eabb8;
    font-weight: normal;
}

td { color: white; }

.paginacion {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 15px;
}

.pagina-boton {
    border: 1px solid #435465;
    background: #243442;
    color: white;
    border-radius: 9px;
    padding: 8px 12px;
    cursor: pointer;
}

.pagina-boton:disabled {
    opacity: 0.35;
    cursor: default;
}

.pagina-info {
    color: #9eabb8;
    font-size: 13px;
    min-width: 90px;
    text-align: center;
}

@media (max-width: 450px) {
    body { padding: 12px; }
    .temperatura { font-size: 52px; }
    .historial { padding: 15px; }
}
</style>
</head>

<body>
<div class="contenedor">

    <h1>ROBERT Clima</h1>

    <div id="estado" class="estado"></div>

    <div id="error" class="error"></div>

    <div class="principal">
        <div>
            <span id="temperatura" class="temperatura">--</span>
            <span class="unidad">°C</span>
        </div>

        <div id="sensacion" class="descripcion">
            Sensación: --
        </div>
    </div>

    <div class="datos">
        <div class="dato">
            <div class="nombre">💧 Humedad</div>
            <div id="humedad" class="valor">--</div>
        </div>

        <div class="dato">
            <div class="nombre">💨 Viento</div>
            <div id="viento" class="valor">--</div>
        </div>

        <div class="dato">
            <div class="nombre">↓ Mínima</div>
            <div id="minima" class="valor">--</div>
        </div>

        <div class="dato">
            <div class="nombre">↑ Máxima</div>
            <div id="maxima" class="valor">--</div>
        </div>
    </div>

    <div id="actualizacion" class="actualizacion">
        Última actualización: --
    </div>

    <div class="historial">
        <h2>Historial</h2>

        <div class="periodos">
            <button class="periodo activo" data-periodo="24h">24 h</button>
            <button class="periodo" data-periodo="3d">3 días</button>
            <button class="periodo" data-periodo="7d">7 días</button>
            <button class="periodo" data-periodo="todo">Todo</button>
        </div>

        <div class="grafico-scroll" id="graficoScroll">
            <div class="grafico">
                <canvas id="graficoTemperatura"></canvas>
            </div>
        </div>

        <div class="ayuda-grafico">
            Deslizá horizontalmente el gráfico para consultar horarios anteriores.
        </div>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Fecha y hora</th>
                        <th>Temp.</th>
                        <th>Sensación</th>
                        <th>Humedad</th>
                        <th>Viento</th>
                    </tr>
                </thead>
                <tbody id="tablaHistorial"></tbody>
            </table>
        </div>

        <div class="paginacion">
            <button id="paginaAnterior" class="pagina-boton">← Anterior</button>
            <div id="paginaInfo" class="pagina-info">Página 1</div>
            <button id="paginaSiguiente" class="pagina-boton">Siguiente →</button>
        </div>
    </div>

</div>

<script>
// ==================================================
// SUPABASE
// ==================================================

const SUPABASE_URL =
    "https://xvztoywavhepjrnynuqf.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_pNAU538ou89EPlKLWYm5Gg_rgJy-uGN";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

// ==================================================
// ÚLTIMA MEDICIÓN
// ==================================================

async function obtenerDatos() {
    const { data, error } = await supabaseClient
        .from("telemetria")
        .select("*")
        .order("creado_en", { ascending: false })
        .limit(1);

    if (error) {
        mostrarError(error.message);
        return;
    }

    if (!data || data.length === 0) {
        mostrarError("No hay datos disponibles.");
        return;
    }

    mostrarDatos(data[0]);
}

function mostrarDatos(datos) {
    document.getElementById("temperatura").textContent =
        Number(datos.temperatura).toFixed(1);

    document.getElementById("sensacion").textContent =
        "Sensación: " +
        Number(datos.sensacion).toFixed(1) +
        " °C";

    document.getElementById("humedad").textContent =
        Number(datos.humedad).toFixed(0) + " %";

    document.getElementById("viento").textContent =
        Number(datos.viento).toFixed(1) + " km/h";

    document.getElementById("minima").textContent =
        Number(datos.minima).toFixed(1) + " °C";

    document.getElementById("maxima").textContent =
        Number(datos.maxima).toFixed(1) + " °C";

    document.getElementById("actualizacion").textContent =
        "Última actualización: " +
        formatearFecha(datos.creado_en);

    document.getElementById("error").style.display = "none";
    document.getElementById("estado").textContent = "● CONECTADO";
    document.getElementById("estado").style.color = "#55d66b";
}

function formatearFecha(fecha) {
    return new Date(fecha).toLocaleString("es-AR", {
        dateStyle: "short",
        timeStyle: "medium"
    });
}

function mostrarError(mensaje) {
    document.getElementById("error").textContent =
        "Error: " + mensaje;

    document.getElementById("error").style.display = "block";
    document.getElementById("estado").textContent =
        "● ERROR DE CONEXIÓN";
    document.getElementById("estado").style.color = "#ff6666";
}

// ==================================================
// HISTORIAL
// ==================================================

let graficoTemperatura = null;
let datosHistorial = [];
let paginaActual = 1;
let periodoActual = "24h";

const REGISTROS_POR_PAGINA = 10;
const LIMITE_HISTORIAL = 1200;

function obtenerFechaInicio(periodo) {
    if (periodo === "todo") return null;

    const ahora = new Date();
    const inicio = new Date(ahora);

    if (periodo === "24h") {
        inicio.setHours(inicio.getHours() - 24);
    } else if (periodo === "3d") {
        inicio.setDate(inicio.getDate() - 3);
    } else if (periodo === "7d") {
        inicio.setDate(inicio.getDate() - 7);
    }

    return inicio.toISOString();
}

async function obtenerHistorial() {
    let consulta = supabaseClient
        .from("telemetria")
        .select("creado_en, temperatura, sensacion, humedad, viento")
        .order("creado_en", { ascending: false })
        .limit(LIMITE_HISTORIAL);

    const fechaInicio = obtenerFechaInicio(periodoActual);

    if (fechaInicio) {
        consulta = consulta.gte("creado_en", fechaInicio);
    }

    const { data, error } = await consulta;

    if (error) {
        console.error("Error obteniendo historial:", error.message);
        return;
    }

    datosHistorial = data || [];
    paginaActual = 1;

    actualizarGrafico();
    actualizarTabla();
}

function actualizarGrafico() {
    const datos = [...datosHistorial].reverse();
    const canvas = document.getElementById("graficoTemperatura");

    if (graficoTemperatura) {
        graficoTemperatura.destroy();
    }

    if (!datos.length) return;

    const etiquetas = datos.map(dato => {
        const fecha = new Date(dato.creado_en);

        if (periodoActual === "24h" || periodoActual === "3d") {
            return fecha.toLocaleString("es-AR", {
                day: "2-digit",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        return fecha.toLocaleDateString("es-AR", {
            day: "2-digit",
            month: "2-digit"
        }) + " " +
        fecha.toLocaleTimeString("es-AR", {
            hour: "2-digit",
            minute: "2-digit"
        });
    });

    const temperaturas = datos.map(dato =>
        Number(dato.temperatura)
    );

    const ancho = Math.max(700, datos.length * 32);
    document.querySelector(".grafico").style.width =
        ancho + "px";

    graficoTemperatura = new Chart(canvas, {
        type: "line",

        data: {
            labels: etiquetas,

            datasets: [{
                label: "Temperatura (°C)",
                data: temperaturas,
                tension: 0.25,
                pointRadius: datos.length > 100 ? 1 : 3,
                pointHoverRadius: 5,
                fill: false
            }]
        },

        options: {
            responsive: true,
            maintainAspectRatio: false,

            plugins: {
                legend: {
                    labels: {
                        color: "white"
                    }
                }
            },

            scales: {
                x: {
                    ticks: {
                        color: "#9eabb8",
                        maxTicksLimit: 12,
                        maxRotation: 0
                    },

                    grid: {
                        color: "#334352"
                    }
                },

                y: {
                    ticks: {
                        color: "#9eabb8"
                    },

                    grid: {
                        color: "#334352"
                    },

                    title: {
                        display: true,
                        text: "°C",
                        color: "#9eabb8"
                    }
                }
            }
        }
    });

    const scroll = document.getElementById("graficoScroll");

    setTimeout(() => {
        scroll.scrollLeft = scroll.scrollWidth;
    }, 0);
}

function actualizarTabla() {
    const tabla = document.getElementById("tablaHistorial");

    tabla.innerHTML = "";

    const totalPaginas = Math.max(
        1,
        Math.ceil(
            datosHistorial.length /
            REGISTROS_POR_PAGINA
        )
    );

    if (paginaActual > totalPaginas) {
        paginaActual = totalPaginas;
    }

    const inicio =
        (paginaActual - 1) *
        REGISTROS_POR_PAGINA;

    const fin =
        inicio +
        REGISTROS_POR_PAGINA;

    const registros =
        datosHistorial.slice(inicio, fin);

    registros.forEach(dato => {
        const fila = document.createElement("tr");

        fila.innerHTML = `
            <td>${formatearFecha(dato.creado_en)}</td>
            <td>${Number(dato.temperatura).toFixed(1)} °C</td>
            <td>${Number(dato.sensacion).toFixed(1)} °C</td>
            <td>${Number(dato.humedad).toFixed(0)} %</td>
            <td>${Number(dato.viento).toFixed(1)} km/h</td>
        `;

        tabla.appendChild(fila);
    });

    document.getElementById("paginaInfo").textContent =
        "Página " + paginaActual +
        " de " + totalPaginas;

    document.getElementById("paginaAnterior").disabled =
        paginaActual <= 1;

    document.getElementById("paginaSiguiente").disabled =
        paginaActual >= totalPaginas;
}

// ==================================================
// CONTROLES DE PERÍODO
// ==================================================

document.querySelectorAll(".periodo").forEach(boton => {
    boton.addEventListener("click", () => {
        document.querySelectorAll(".periodo").forEach(otro => {
            otro.classList.remove("activo");
        });

        boton.classList.add("activo");

        periodoActual = boton.dataset.periodo;

        obtenerHistorial();
    });
});

// ==================================================
// PAGINACIÓN
// ==================================================

document.getElementById("paginaAnterior")
    .addEventListener("click", () => {
        if (paginaActual > 1) {
            paginaActual--;
            actualizarTabla();
        }
    });

document.getElementById("paginaSiguiente")
    .addEventListener("click", () => {
        const totalPaginas = Math.max(
            1,
            Math.ceil(
                datosHistorial.length /
                REGISTROS_POR_PAGINA
            )
        );

        if (paginaActual < totalPaginas) {
            paginaActual++;
            actualizarTabla();
        }
    });

// ==================================================
// INICIO Y ACTUALIZACIÓN AUTOMÁTICA
// ==================================================

obtenerDatos();
obtenerHistorial();

setInterval(() => {
    obtenerDatos();
    obtenerHistorial();
}, 30000);
</script>

</body>
</html>
